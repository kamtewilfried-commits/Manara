<div class="mb-4 flex flex-wrap items-center gap-3 rounded-3xl border border-slate-200 bg-white p-4 shadow-lg">

  <!-- APPEL -->
  <button
    *ngIf="!isCalling"
    (click)="startCall()"
    class="flex items-center gap-2 rounded-2xl bg-emerald-600 px-5 py-3 font-bold text-white shadow transition hover:bg-emerald-700">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372a1.125 1.125 0 0 0-.856-1.091l-4.423-1.106a1.125 1.125 0 0 0-1.173.417l-.97 1.293a1.125 1.125 0 0 1-1.21.38 12.035 12.035 0 0 1-7.143-7.143 1.125 1.125 0 0 1 .38-1.21l1.293-.97a1.125 1.125 0 0 0 .417-1.173L7.213 3.106A1.125 1.125 0 0 0 6.122 2.25H4.75A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
    </svg>

    Appeler
  </button>

  <!-- PARTAGE ÉCRAN -->
  <button
    *ngIf="isCalling"
    (click)="toggleScreenShare()"
    class="flex items-center gap-2 rounded-2xl bg-cyan-600 px-5 py-3 font-bold text-white shadow transition hover:bg-cyan-700">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M2.25 6.75A2.25 2.25 0 0 1 4.5 4.5h15a2.25 2.25 0 0 1 2.25 2.25v9A2.25 2.25 0 0 1 19.5 18h-15a2.25 2.25 0 0 1-2.25-2.25v-9ZM7.5 21h9"/>
    </svg>

    {{ isScreenSharing ? 'Arrêter partage' : 'Partager écran' }}
  </button>

  <!-- QUITTER -->
  <button
    *ngIf="isCalling"
    (click)="leaveCall()"
    class="flex items-center gap-2 rounded-2xl bg-red-600 px-5 py-3 font-bold text-white shadow transition hover:bg-red-700">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2">

      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m-3-3h9m0 0-3-3m3 3-3 3"/>
    </svg>

    Quitter
  </button>

  <!-- MICRO -->
<button
  *ngIf="isCalling"
  (click)="toggleMicrophone()"
  class="flex items-center gap-2 rounded-2xl px-5 py-3 font-bold text-white shadow transition"
  [class.bg-emerald-600]="isMicEnabled"
  [class.hover:bg-emerald-700]="isMicEnabled"
  [class.bg-slate-600]="!isMicEnabled"
  [class.hover:bg-slate-700]="!isMicEnabled">

  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">

    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3m-3-3h6m-3-18a3 3 0 0 1 3 3v7.5a3 3 0 1 1-6 0v-7.5a3 3 0 0 1 3-3Z"/>
  </svg>

  {{ isMicEnabled ? 'Micro activé' : 'Micro coupé' }}
</button>

<!-- CAMÉRA -->
<button
  *ngIf="isCalling"
  (click)="toggleCamera()"
  class="flex items-center gap-2 rounded-2xl px-5 py-3 font-bold text-white shadow transition"
  [class.bg-cyan-600]="isCameraEnabled"
  [class.hover:bg-cyan-700]="isCameraEnabled"
  [class.bg-slate-600]="!isCameraEnabled"
  [class.hover:bg-slate-700]="!isCameraEnabled">

  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">

    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="m15.75 10.5 4.72-2.36A.75.75 0 0 1 21.75 8.8v6.4a.75.75 0 0 1-1.28.53l-4.72-2.36m0-3.37c0-.621-.504-1.125-1.125-1.125H4.875c-.621 0-1.125.504-1.125 1.125v6.75c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125v-6.75Z"/>
  </svg>

  {{ isCameraEnabled ? 'Caméra activée' : 'Caméra désactivée' }}
</button>

<button
  *ngIf="isCalling"
  (click)="toggleFullscreen()"
  class="flex items-center gap-2 rounded-2xl bg-slate-800 px-5 py-3 font-bold text-white shadow transition hover:bg-slate-900">

  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2">

    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M3.75 3.75h6v1.5h-4.5v4.5h-1.5v-6Zm16.5 0v6h-1.5v-4.5h-4.5v-1.5h6Zm-16.5 16.5v-6h1.5v4.5h4.5v1.5h-6Zm16.5-6v6h-6v-1.5h4.5v-4.5h1.5Z"/>
  </svg>

  Plein écran
</button>
</div>

<div *ngIf="isCalling" id="video-area">
  <!-- caméra locale -->

  <!-- ÉCRAN PARTAGÉ (PRIORITAIRE) -->
  <video
    *ngIf="isScreenSharing"
    #localScreenShare
    class="screen-main"
    autoplay
    playsinline
    muted>
  </video>

  <!-- ÉCRAN PARTAGÉ REMOTE -->
  <video
    *ngFor="let participant of remoteParticipants"
    #remoteScreenShares
    class="screen-main"
    autoplay
    playsinline>
  </video>

  <!-- CAMÉRAS -->
  <div class="camera-bar">

    <!-- TA CAM -->
    <video
      #localVideo
      class="local-small"
      autoplay
      playsinline
      muted>
    </video>

    <!-- CAM REMOTE -->
    <video
      *ngFor="let participant of remoteParticipants"
      #remoteVideos
      class="remote-small"
      autoplay
      playsinline>
    </video>
<audio
  *ngFor="let participant of remoteParticipants; trackBy: trackByParticipant"
  #remoteAudios
  autoplay>
</audio>


</div>
</div>
