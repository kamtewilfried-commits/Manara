<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
  <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-2xl p-8 shadow-lg">

    <h2 class="text-2xl font-bold text-white text-center mb-6">
      Code de vérification
    </h2>

    <!-- ERROR -->
    <div *ngIf="errorMessage"
         class="mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3">
      {{ errorMessage }}
    </div>

    <!-- SUCCESS -->
    <div *ngIf="successMessage"
         class="mb-4 rounded-lg bg-green-100 text-green-700 px-4 py-3">
      {{ successMessage }}
    </div>

    <!-- FORM -->
    <form class="space-y-4"
          (ngSubmit)="onSubmit()"
          #verificationForm="ngForm">

      <!-- OTP INPUT -->
      <div>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white text-center tracking-widest text-lg placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          type="text"
          name="code"
          [(ngModel)]="code"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="123456"
          required
        />
      </div>

      <!-- VALIDATE BUTTON -->
      <button
        class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition disabled:opacity-60 disabled:cursor-not-allowed"
        type="submit"
        [disabled]="verificationForm.invalid || isLoading"
      >
        {{ isLoading ? 'Validation...' : 'Valider' }}
      </button>

      <!-- RESEND BUTTON -->
      <button
        type="button"
        (click)="onResendCode()"
        [disabled]="isLoading"
        class="w-full py-3 rounded-lg bg-white/30 hover:bg-white/40 text-white font-semibold transition disabled:opacity-60"
      >
        Renvoyer le code
      </button>

    </form>

    <!-- INFO -->
    <p class="mt-4 text-center text-white text-sm">
      Entrez le code reçu par SMS ou email
    </p>

  </div>
</div>
