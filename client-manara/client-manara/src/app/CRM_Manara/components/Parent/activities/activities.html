<div class="min-h-screen bg-slate-100 dark:bg-slate-900 transition-colors duration-200">
  <app-header-parent [connectedUser]="connectedUser"></app-header-parent>

  <div class="flex min-h-screen bg-slate-100 dark:bg-slate-900">
    <app-sidebar-parent
      [activePage]="'activites'"
      [connectedUser]="connectedUser"
      [unreadNotifications]="unreadNotifications">
    </app-sidebar-parent>

    <main class="flex-1 p-8">

<div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
  <div
    *ngFor="let activity of filteredActivityList"
    class="rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 shadow-sm"
  >
    <div class="mb-4 flex items-center justify-between">
  <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100 overflow-hidden">
  <img
    *ngIf="activity.photo"
    [src]="'http://localhost:8080' + activity.photo"
    alt="Photo activité"
    class="h-full w-full object-cover"
  />
</div>

      <span
        class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
        [ngClass]="activity.active ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'"
      >
        {{ activity.active ? 'Disponible' : 'Inactive' }}
      </span>
    </div>

    <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">
      {{ activity.name }}
    </h2>

    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
      {{ activity.description }}
    </p>

    <div class="mt-3 text-sm text-slate-400 dark:text-slate-500">
      <span *ngIf="activity.animateurId">
        Animateur · {{ activity.animateurFullName  }}
      </span>
    </div>

    <a
      [routerLink]="['/parent/activites', activity.id]"
      class="mt-5 inline-flex items-center rounded-full bg-blue-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-blue-800"
    >
      Voir et inscrire
    </a>
  </div>
</div>

<!-- Aucun résultat -->
<div
  *ngIf="filteredActivityList.length === 0"
  class="mt-6 rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-6 py-10 text-center text-sm font-medium text-slate-400 dark:text-slate-500 shadow-sm"
>
  Aucune activité ne correspond à votre recherche.
</div>

    </main>
  </div>
</div>
