<div class="min-h-screen bg-slate-100 dark:bg-slate-900 transition-colors duration-200">
  <app-header-parent [connectedUser]="connectedUser"></app-header-parent>

  <div class="flex min-h-screen bg-slate-100 dark:bg-slate-900">
    <app-sidebar-parent
      [activePage]="'notifications'"
      [connectedUser]="connectedUser"
      [unreadNotifications]="unreadNotifications">
    </app-sidebar-parent>

    <main class="flex-1 p-4 md:p-8">

      <!-- En-tête -->
      <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Notifications</h1>
          <p class="mt-1 text-sm font-medium text-slate-500 dark:text-slate-400">
            {{ unreadNotifications }} notification(s) non lue(s)
          </p>
        </div>

        <button
          type="button"
          (click)="marquerToutLu()"
          [disabled]="unreadNotifications === 0"
          class="inline-flex items-center rounded-full border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2 text-sm font-bold text-slate-700 dark:text-slate-200 shadow-sm transition hover:bg-slate-50 dark:hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50">
          Tout marquer lu
        </button>
      </div>

      <!-- Erreur -->
      <div *ngIf="errorMessage"
           class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
        {{ errorMessage }}
      </div>

      <!-- Filtres -->
      <div class="mb-6 flex flex-wrap gap-2">
        <button
          type="button"
          (click)="filtrerType('')"
          class="rounded-full px-4 py-2 text-sm font-bold transition"
          [ngClass]="currentTypeFilter === '' ? 'bg-slate-900 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'">
          Toutes
        </button>
        <button
          type="button"
          (click)="filtrerType('CONFIRMATION')"
          class="rounded-full px-4 py-2 text-sm font-bold transition"
          [ngClass]="currentTypeFilter === 'CONFIRMATION' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'">
          Confirmations
        </button>
        <button
          type="button"
          (click)="filtrerType('REMINDER')"
          class="rounded-full px-4 py-2 text-sm font-bold transition"
          [ngClass]="currentTypeFilter === 'REMINDER' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'">
          Rappels
        </button>
        <button
          type="button"
          (click)="filtrerType('CANCELLATION')"
          class="rounded-full px-4 py-2 text-sm font-bold transition"
          [ngClass]="currentTypeFilter === 'CANCELLATION' ? 'bg-red-600 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'">
          Annulations
        </button>
        <button
          type="button"
          (click)="filtrerType('RECEIPT')"
          class="rounded-full px-4 py-2 text-sm font-bold transition"
          [ngClass]="currentTypeFilter === 'RECEIPT' ? 'bg-purple-600 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'">
          Reçus
        </button>
      </div>

      <!-- Chargement -->
      <div *ngIf="isLoading" class="flex justify-center py-16">
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"></div>
      </div>

      <!-- Liste notifications -->
      <div *ngIf="!isLoading" class="space-y-3">

        <div
          *ngFor="let notif of filteredNotifications"
          class="flex gap-4 rounded-2xl border p-4 md:p-5 shadow-sm transition"
          [ngClass]="notif.isRead
            ? 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800'
            : 'border-blue-200 dark:border-blue-700 bg-blue-50/30 dark:bg-blue-900/10'">

          <!-- Point lu/non-lu -->
          <div class="mt-1.5 h-2.5 w-2.5 flex-shrink-0 rounded-full"
               [ngClass]="notif.isRead ? 'bg-slate-300' : 'bg-blue-600'"></div>

          <!-- Contenu -->
          <div class="flex-1 min-w-0">
            <div class="flex flex-col gap-1 sm:flex-row sm:items-start sm:justify-between">
              <p class="text-sm font-bold"
                 [ngClass]="notif.isRead ? 'text-slate-500 dark:text-slate-400' : 'text-slate-900 dark:text-white'">
                {{ notif.subject }}
              </p>
              <span class="text-xs text-slate-400 flex-shrink-0">
                {{ notif.sentAt | date:'d MMM yyyy · HH:mm' }}
              </span>
            </div>

            <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{ notif.message }}</p>

            <!-- Actions -->
            <div class="mt-3 flex flex-wrap items-center gap-3">
              <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                    [ngClass]="getTypeClass(notif.type)">
                {{ getTypeLabel(notif.type) }}
              </span>

              <button
                type="button"
                *ngIf="!notif.isRead"
                (click)="marquerLu(notif)"
                class="text-xs font-bold text-blue-700 dark:text-blue-400 hover:text-blue-900 dark:hover:text-blue-300 transition">
                Marquer lu
              </button>

              <!-- Bouton reçu (uniquement pour les notifications de type RECEIPT) -->
              <button
                type="button"
                *ngIf="notif.type === 'RECEIPT'"
                (click)="imprimerRecu(notif)"
                class="inline-flex items-center gap-1.5 rounded-full bg-purple-50 dark:bg-purple-900/30 border border-purple-200 dark:border-purple-700 px-3 py-1.5 text-xs font-bold text-purple-700 dark:text-purple-300 hover:bg-purple-100 dark:hover:bg-purple-900/50 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                </svg>
                Télécharger reçu
              </button>
            </div>
          </div>
        </div>

        <!-- État vide -->
        <div
          *ngIf="filteredNotifications.length === 0"
          class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-6 py-12 text-center shadow-sm">
          <svg class="mx-auto mb-3 w-10 h-10 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <p class="text-sm text-slate-400 dark:text-slate-500 font-medium">Aucune notification pour le moment.</p>
        </div>

      </div>
    </main>
  </div>
</div>
