<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
  <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-2xl p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-white text-center mb-6">Créer un compte</h2>

    <div
      *ngIf="alertMessage"
      class="mb-4 rounded-lg px-4 py-3 text-sm font-medium"
      [ngClass]="
        alertType === 'error'
          ? 'bg-red-100 text-red-700 border border-red-300'
          : 'bg-green-100 text-green-700 border border-green-300'
      "
    >
      {{ alertMessage }}
    </div>

    <form id="registerForm" class="space-y-4" (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-white mb-1" for="nom">Nom</label>
          <input
            class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
            id="nom"
            name="nom"
            type="text"
            [(ngModel)]="form.nom"
            required
          />
        </div>

        <div>
          <label class="block text-sm text-white mb-1" for="prenom">Prénom</label>
          <input
            class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
      
            id="prenom"
            name="prenom"
            type="text"
            [(ngModel)]="form.prenom"
            required
          />
          <p *ngIf="form.email && !isValidEmail()" class="mt-1 text-sm text-red-200">
  Email invalide.
</p>
        </div>
      </div>

      <div>
        <label class="block text-sm text-white mb-1" for="date">Date de naissance</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          id="date"
          name="date"
          type="date"
          [(ngModel)]="form.date"
           [max]="maxBirthDate"
          required
        />
      </div>

      <div>
        <label class="block text-sm text-white mb-1" for="email">Email</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
                [ngClass]="{
    'border-2 border-red-400 focus:ring-red-300': form.email && !isValidEmail(),
    'border-2 border-green-400 focus:ring-green-300': form.email && isValidEmail()
  }"
          type="email"
          id="email"
          name="email"
          [(ngModel)]="form.email"
          required
          email
        />
      </div>

      <div>
        <label class="block text-sm text-white mb-1" for="phone">Téléphone</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          type="text"
          id="phone"
          name="phone"
          placeholder="5145551234"
          [(ngModel)]="form.phone"
          
          required
        />
      </div>

      <div>
        <label class="block text-sm text-white mb-1" for="password">Mot de passe</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
           [ngClass]="{
    'border-2 border-red-400 focus:ring-red-300': form.password && !isStrongPassword(),
    'border-2 border-green-400 focus:ring-green-300': form.password && isStrongPassword()
  }"
          type="password"
          id="password"
          name="password"
          [(ngModel)]="form.password"
          required
        />
      </div>

      <div>
        <label class="block text-sm text-white mb-1" for="confirm">Confirmer le mot de passe</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
            [ngClass]="{
    'border-2 border-red-400 focus:ring-red-300': form.confirm && form.confirm !== form.password,
    'border-2 border-green-400 focus:ring-green-300': form.confirm && form.confirm === form.password
  }"

          id="confirm"
          name="confirm"
          type="password"
          [(ngModel)]="form.confirm"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading"
        class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isLoading ? "Inscription en cours..." : "S'inscrire" }}
      </button>
    </form>

    <p class="mt-4 text-center text-white text-sm">
      Déjà un compte ?
      <a routerLink="/login" class="underline hover:text-indigo-200">Se connecter</a>
    </p>
  </div>
</div>
