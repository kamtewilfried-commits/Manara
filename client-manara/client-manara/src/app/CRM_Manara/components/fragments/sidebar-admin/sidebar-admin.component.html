<nav
  [ngClass]="isOpen ? 'w-72 px-5' : 'w-20 px-3'"
  class="sticky top-0 flex h-screen flex-col overflow-hidden bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 py-6 text-white shadow-2xl transition-all duration-300"
>

  <!-- Glow -->
  <div class="absolute inset-0 bg-black/5"></div>

  <div class="relative flex h-full flex-col">

    <!-- Toggle -->
    <button
      (click)="toggleSidebar()"
      [ngClass]="isOpen ? 'w-full justify-between px-4 py-3' : 'mx-auto h-12 w-12 justify-center p-0'"
      class="mb-6 flex items-center rounded-2xl border border-white/20 bg-white/10 font-bold text-white backdrop-blur transition hover:bg-white/20"
    >

      <span
        class="overflow-hidden whitespace-nowrap transition-all duration-300"
        [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
      >
        Menu admin
      </span>

      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-6 w-6 flex-shrink-0"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor"
           stroke-width="2">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>

    </button>

    <!-- Logo -->
    <div
      class="mb-8 flex justify-center overflow-hidden transition-all duration-300"
      [ngClass]="isOpen ? 'max-h-28 opacity-100' : 'max-h-0 opacity-0 mb-0'"
    >

      <div class="rounded-full bg-white/10 p-2 shadow-lg backdrop-blur">

        <img
          src="images/Logo.png"
          alt="Logo CRM Manara"
          class="h-16 w-16 rounded-full border border-white/20 object-cover"
        />

      </div>

    </div>

    <!-- Links -->
    <div class="flex-1 space-y-2">

      <!-- DASHBOARD -->
      <a
        routerLink="/dashboard"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'dashboard'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-6 w-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="1.8">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 10.5L12 3l9 7.5"/>
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M5.25 9.75V20.25H18.75V9.75"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.dashboard') }}
        </span>

      </a>

      <!-- USERS -->
      <a
        routerLink="/utilisateurs"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'users'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             fill="currentColor"
             class="bi bi-people-fill h-6 w-6 flex-shrink-0"
             viewBox="0 0 16 16">
          <path d="M13 7a2 2 0 1 0-1.999-2A2 2 0 0 0 13 7zM5 7a2 2 0 1 0-2-2 2 2 0 0 0 2 2zm8 1c-1.657 0-3 1.119-3 2.5V12h6v-1.5C16 9.119 14.657 8 13 8zM5 8c-1.657 0-3 1.119-3 2.5V12h6v-1.5C8 9.119 6.657 8 5 8z"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.users') }}
        </span>

      </a>

      <!-- ACTIVITIES -->
      <a
        routerLink="/activites"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'projects'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             fill="currentColor"
             class="bi bi-grid-fill h-6 w-6 flex-shrink-0"
             viewBox="0 0 16 16">
          <path d="M1 1h6v6H1V1zm8 0h6v6H9V1zM1 9h6v6H1V9zm8 0h6v6H9V9z"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.activities') }}
        </span>

      </a>

      <!-- SESSIONS -->
      <a
        routerLink="/sessions"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'calendar'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-6 w-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="1.8">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.sessions') }}
        </span>

      </a>

      <!-- REGISTRATIONS -->
      <a
        routerLink="/inscriptions"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'inscriptions'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-6 w-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="1.8">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5.25h6M9 9.75h6M9 14.25h6M6.75 5.25h.008v.008H6.75V5.25zm0 4.5h.008v.008H6.75V9.75zm0 4.5h.008v.008H6.75v-.008zM4.5 3h15A1.5 1.5 0 0 1 21 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-15A1.5 1.5 0 0 1 4.5 3z"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.registrations') }}
        </span>

      </a>

      <!-- NOTIFICATIONS -->
      <a
        routerLink="/admin/notifications"
        class="flex items-center rounded-2xl text-[15px] font-extrabold transition-all duration-300"
        [class.gap-4]="isOpen"
        [class.px-4]="isOpen"
        [class.py-3]="isOpen"
        [class.mx-auto]="!isOpen"
        [class.h-12]="!isOpen"
        [class.w-12]="!isOpen"
        [class.justify-center]="!isOpen"
        [ngClass]="activePage === 'notifications'
          ? 'bg-white text-emerald-700 shadow-xl shadow-black/10'
          : 'text-white/90 hover:bg-white/15 hover:text-white'"
      >

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-6 w-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="1.8">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>

        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-300"
          [ngClass]="isOpen ? 'max-w-[160px] opacity-100' : 'max-w-0 opacity-0'"
        >
          {{ i18n.t('nav.notifications') }}
        </span>

      </a>

    </div>

    <!-- Bottom -->
    <div
      class="mt-6 overflow-hidden transition-all duration-300"
      [ngClass]="isOpen ? 'opacity-100' : 'opacity-0'"
    >

      <div class="rounded-3xl border border-white/20 bg-white/10 p-4 text-white backdrop-blur">

        <p class="text-sm font-bold">
          CRM Manara
        </p>

        <p class="mt-1 text-xs text-white/80">
          Administration du centre communautaire.
        </p>

      </div>

    </div>

  </div>

</nav>
