<div id="chat-widget" class="fixed bottom-6 right-6 z-50">
 <button
  *ngIf="!isOpen"
  id="chat-toggle"
  type="button"
  (click)="toggleChat()"
  class="h-14 w-14 rounded-full bg-slate-900 hover:bg-slate-800 text-white shadow-2xl flex items-center justify-center text-2xl transition"
>
    <img
      src="/images/Logo.png"
      alt="Logo Manara"
      class="w-32 h-15 rounded-full object-cover border-4 border-blue-900 shadow-lg"
    />
  </button>

  <div
    *ngIf="isOpen"
    id="chat-panel"
    class="mt-4 w-[360px] max-w-[92vw] h-[540px] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col"
  >
    <div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between">
      <div>
        <h3 class="font-semibold text-sm flex items-center gap-2">
          <img
            src="/images/Logo.png"
            alt="Logo Manara"
            class="w-10 h-10 rounded-full object-cover border-2 border-blue-900 shadow-lg"
          />
          <span>ManaraGPT</span>
        </h3>
        <p class="text-xs text-slate-300">Centre communautaire</p>
      </div>

      <button
        id="chat-close"
        type="button"
        (click)="closeChat()"
        class="text-white text-lg hover:opacity-80"
      >
        ✕
      </button>
    </div>

    <div #messagesContainer id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
      <div
        *ngFor="let message of messages"
        [class]="message.sender === 'user' ? 'flex justify-end' : 'flex justify-start'"
      >
        <div
          [class]="
            message.sender === 'user'
              ? 'max-w-[85%] bg-slate-900 text-white rounded-2xl px-4 py-3 shadow-sm whitespace-pre-line'
              : 'max-w-[85%] bg-white border border-slate-200 text-slate-800 rounded-2xl px-4 py-3 shadow-sm whitespace-pre-line'
          "
        >
          {{ message.text }}
        </div>
      </div>

      <div *ngIf="isTyping" class="flex justify-start">
        <div class="max-w-[85%] bg-white border border-slate-200 text-slate-500 rounded-2xl px-4 py-3 shadow-sm">
          Assistant en train d’écrire...
        </div>
      </div>
    </div>

    <form (ngSubmit)="sendMessage()" class="border-t border-slate-200 p-3 bg-white flex gap-2">
  <button
    type="button"
    (click)="startVoice()"
    class="rounded-xl border border-slate-300 px-3 py-2 text-sm hover:bg-slate-100"
  >
    {{ isListening ? '🎙️' : '🎤' }}
  </button>
  <input
    [(ngModel)]="currentMessage"
    name="currentMessage"
    type="text"
    placeholder="Écrivez votre message..."
    class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
    required
  />

  <button
    type="submit"
    class="rounded-xl bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 text-sm font-medium"
  >
    Envoyer
  </button>
</form>
  </div>
</div>
