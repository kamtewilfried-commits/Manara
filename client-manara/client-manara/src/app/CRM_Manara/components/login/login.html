<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
  <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-2xl p-8 shadow-lg">

    <h2 class="text-2xl font-bold text-white text-center mb-6">Connexion</h2>

    <!-- ERROR -->
    <div *ngIf="errorMessage" class="mb-4 rounded-lg bg-red-100 text-red-700 px-4 py-3">
      {{ errorMessage }}
    </div>

    <!-- SUCCESS -->
    <div *ngIf="successMessage" class="mb-4 rounded-lg bg-green-100 text-green-700 px-4 py-3">
      {{ successMessage }}
    </div>

    <!-- ================= LOGIN FORM ================= -->
    <form *ngIf="!requiresOtp"
          class="space-y-4"
          (ngSubmit)="onLogin()"
          #loginForm="ngForm">

      <!-- EMAIL -->
      <div>
        <label class="block text-sm text-white mb-1">Email</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="exemple@mail.com"
        />
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="block text-sm text-white mb-1">Mot de passe</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
        />
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isLoading ? 'Connexion...' : 'Continuer' }}
      </button>
    </form>

    <!-- ================= OTP FORM ================= -->
    <form *ngIf="requiresOtp"
          class="space-y-4"
          (ngSubmit)="onVerifyOtp()"
          #otpForm="ngForm">

      <div>
        <label class="block text-sm text-white mb-1">Code OTP</label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-white/30 text-white text-center tracking-widest text-lg focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition"
          type="text"
          name="otp"
          [(ngModel)]="otp"
          maxlength="6"
          required
          placeholder="123456"
        />
      </div>

      <button
        type="submit"
        [disabled]="otpForm.invalid || isLoading"
        class="w-full py-3 rounded-lg bg-green-500 hover:bg-green-600 text-white font-semibold transition"
      >
        Vérifier le code
      </button>

      <button
        type="button"
        (click)="onResendOtp()"
        class="w-full py-3 rounded-lg bg-white/30 hover:bg-white/40 text-white font-semibold transition"
      >
        Renvoyer le code
      </button>
    </form>

    <!-- ================= GOOGLE LOGIN ================= -->
    <div class="mt-4">
    <button
  type="button"
  (click)="loginWithGoogle()"
  class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-red-500 hover:bg-red-600 text-white font-semibold transition"
>  <img src="/images/google-icon-logo.svg" alt="Google" class="w-5 h-5" />
  Continuer avec Google
</button>
      
     
    </div>

    <!-- ================= REGISTER ================= -->
    <p class="mt-4 text-center text-white text-sm">
      Pas encore de compte ?
      <a routerLink="/register" class="underline hover:text-indigo-200">
        Créer un compte
      </a>
    </p>

  </div>
</div>
