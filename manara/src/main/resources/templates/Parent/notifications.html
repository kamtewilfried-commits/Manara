<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Notifications</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="bg-slate-950">

<div th:replace="~{fragments/headerParent :: headerParent}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarParent :: sidebarParent('notifications')}"></div>

    <main  class="container page">
        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Notifications</h1>
                <p class="mt-1 text-sm font-medium text-slate-500"
                   th:text="${unreadNotifications} + ' notification(s) non lue(s)'">
                    0 non lues
                </p>
            </div>

            <form th:action="@{/parent/notifications/lire-tout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"
                        th:disabled="${unreadNotifications == 0}"
                        class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                    Tout marquer lu
                </button>
            </form>
        </div>

        <!-- Filtres -->
        <div class="mb-6 flex flex-wrap gap-3">
            <button class="inline-flex items-center rounded-full bg-blue-700 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800"
                    onclick="filtrerType('')">
                Toutes
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerType('Confirmation')">
                Confirmations
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerType('Rappel')">
                Rappels
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerType('Annulation')">
                Annulations
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerType('Reçu')">
                Reçus
            </button>
        </div>

        <!-- Liste notifications -->
        <div class="space-y-4" id="notifList">

            <div class="flex gap-4 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm"
                 th:each="notif : ${notifications}"
                 th:attr="data-type=${notif.type}">

                <!-- Dot -->
                <div class="mt-1 h-3 w-3 rounded-full"
                     th:classappend="${notif.isRead} ? ' bg-slate-300' : ' bg-blue-600'">
                </div>

                <!-- Contenu -->
                <div class="flex-1">
                    <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                        <div class="text-base font-bold"
                             th:classappend="${notif.isRead} ? ' text-slate-500' : ' text-slate-900'"
                             th:text="${notif.subject}">
                            Sujet
                        </div>

                        <span class="text-xs font-medium text-slate-400"
                              th:text="${#temporals.format(notif.sentAt, 'd MMM HH:mm')}">
                    Date
                </span>
                    </div>

                    <div class="mt-2 text-sm text-slate-600"
                         th:text="${notif.message}">
                        Message
                    </div>

                    <div class="mt-4 flex flex-wrap items-center gap-3">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${notif.type == 'CONFIRMATION'} ? ' bg-emerald-50 text-emerald-700' :
                                      (${notif.type == 'REMINDER'} ? ' bg-blue-50 text-blue-700' :
                                      (${notif.type == 'CANCELLATION'} ? ' bg-red-50 text-red-700' : ' bg-purple-50 text-purple-700'))"
                      th:text="${notif.type == 'CONFIRMATION'} ? 'Confirmation' :
                               (${notif.type == 'REMINDER'} ? 'Rappel' :
                               (${notif.type == 'CANCELLATION'} ? 'Annulation' : 'Reçu'))">
                    Type
                </span>

                        <form th:action="@{/parent/notifications/{id}/lire(id=${notif.id})}"
                              method="post"
                              class="inline"
                              th:if="${!notif.isRead}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit"
                                    class="text-xs font-bold text-blue-700 transition hover:text-blue-800">
                                Marquer lu
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Aucune notification -->
            <div th:if="${#lists.isEmpty(notifications)}"
                 class="rounded-3xl border border-slate-200 bg-white px-6 py-10 text-center text-sm font-medium text-slate-400 shadow-sm">
                Aucune notification pour le moment.
            </div>

        </div>
    </main>
</div>

<script>
    function filtrerType(type) {
        document.querySelectorAll('.notif-item').forEach(item => {
            item.style.display = (type === '' || item.dataset.type === type.toUpperCase())
                ? '' : 'none';
        });
    }
</script>
</body>
</html>
