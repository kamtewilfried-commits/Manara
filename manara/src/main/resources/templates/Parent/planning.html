<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Planning</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="bg-slate-950" >

<div th:replace="~{fragments/headerParent :: headerParent}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarParent :: sidebarParent('planning')}"></div>

    <main  class="container page">

        <!-- Navigation semaine -->
        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Planning</h1>
                <p class="mt-1 text-sm font-medium text-slate-500" th:text="${weekLabel}">
                    Semaine du...
                </p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <a th:href="@{/parent/planning(semaine=${previousWeek})}"
                   class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50">
                    ← Préc.
                </a>

                <a th:href="@{/parent/planning}"
                   class="inline-flex items-center rounded-full bg-blue-700 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                    Aujourd'hui
                </a>

                <a th:href="@{/parent/planning(semaine=${nextWeek})}"
                   class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50">
                    Suiv. →
                </a>
            </div>
        </div>

        <!-- Légende -->
        <div class="mb-4 flex flex-wrap gap-4">
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <div class="h-3 w-3 rounded-sm border-l-4 border-blue-600 bg-blue-100"></div>
                <span>Activité confirmée</span>
            </div>

            <div class="flex items-center gap-2 text-xs text-slate-500">
                <div class="h-3 w-3 rounded-sm border-l-4 border-amber-700 bg-amber-100"></div>
                <span>En attente de confirmation</span>
            </div>
        </div>

        <!-- Grille planning -->
        <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
            <div class="min-w-[900px]">
                <!-- En-tête jours -->
                <div class="grid grid-cols-8 border-b border-slate-200 bg-slate-50 text-slate-500">
                    <div class="px-4 py-4 text-xs font-extrabold uppercase tracking-wide">Heure</div>
                    <div th:each="day : ${weekDays}"
                         th:text="${day}"
                         class="px-4 py-4 text-xs font-extrabold uppercase tracking-wide">
                        Lun
                    </div>
                </div>

                <!-- Lignes horaires -->
                <div th:each="slot : ${timeSlots}"
                     class="grid grid-cols-8 border-b border-slate-100 last:border-b-0">
                    <div class="border-r border-slate-100 px-4 py-4 text-sm font-bold text-slate-600"
                         th:text="${slot}">
                        09h00
                    </div>

                    <div class="min-h-[110px] border-r border-slate-100 p-3 last:border-r-0"
                         th:each="day : ${weekDays}">
                        <div th:each="event : ${planningEvents}"
                             th:if="${event.day == day and event.slot == slot}"
                             class="rounded-2xl border-l-4 p-3 text-sm shadow-sm"
                             th:classappend="${event.status == 'CONFIRMED'} ? ' border-blue-600 bg-blue-50 text-blue-900' : ' border-amber-700 bg-amber-50 text-amber-900'">

                            <strong class="block text-xs font-extrabold uppercase tracking-wide"
                                    th:text="${event.activityName}">
                                Activité
                            </strong>

                            <span class="mt-1 block text-xs opacity-80"
                                  th:text="${event.childName}">
                        Enfant
                    </span>

                            <span class="mt-1 block text-xs opacity-70"
                                  th:text="${event.location}">
                        Lieu
                    </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message si aucune session -->
        <div th:if="${#lists.isEmpty(planningEvents)}"
             class="rounded-3xl border border-slate-200 bg-white px-6 py-10 text-center shadow-sm">
            <p class="mb-4 text-sm font-medium text-slate-500">
                Aucune session prévue pour cette semaine.
            </p>
            <a th:href="@{/parent/activites}"
               class="inline-flex items-center rounded-full bg-blue-700 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                Voir les activités disponibles
            </a>
        </div>
    </main>
</div>

</body>
</html>
