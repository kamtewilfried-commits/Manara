<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Modifier un enfant</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="bg-slate-950">

<div th:replace="~{fragments/headerParent :: headerParent}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarParent :: sidebarParent('enfants')}"></div>

    <main  class="container page">
        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900"
                    th:text="'Modifier — ' + ${childForm.firstName} + ' ' + ${childForm.lastName}">
                    Modifier un enfant
                </h1>
                <p class="mt-1 text-sm font-medium text-slate-500">
                    Mettez à jour les informations de l'enfant
                </p>
            </div>

            <a th:href="@{/parent/enfants}"
               class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50">
                ← Retour
            </a>
        </div>

        <div th:if="${erreur}"
             class="mb-6 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
             th:text="${erreur}"></div>

        <div class="max-w-xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <form th:action="@{/parent/enfants/{id}/modifier(id=${childForm.id})}"
                  method="post"
                  th:object="${childForm}"
                  class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">

                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Prénom</label>
                        <input type="text"
                               th:field="*{firstName}"
                               required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:border-blue-300 focus:ring-4 focus:ring-blue-100">
                        <span class="mt-1 block text-sm text-red-600"
                              th:if="${#fields.hasErrors('firstName')}"
                              th:errors="*{firstName}"></span>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Nom</label>
                        <input type="text"
                               th:field="*{lastName}"
                               required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:border-blue-300 focus:ring-4 focus:ring-blue-100">
                        <span class="mt-1 block text-sm text-red-600"
                              th:if="${#fields.hasErrors('lastName')}"
                              th:errors="*{lastName}"></span>
                    </div>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Date de naissance</label>
                    <input type="date"
                           th:field="*{birthDate}"
                           required
                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:border-blue-300 focus:ring-4 focus:ring-blue-100">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">
                        Allergies
                        <span class="font-normal text-slate-400">(optionnel)</span>
                    </label>
                    <input type="text"
                           th:field="*{allergies}"
                           placeholder="Ex : arachides, lactose, gluten..."
                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:border-blue-300 focus:ring-4 focus:ring-blue-100">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">
                        Notes médicales
                        <span class="font-normal text-slate-400">(optionnel)</span>
                    </label>
                    <textarea th:field="*{medicalNotes}"
                              rows="4"
                              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:border-blue-300 focus:ring-4 focus:ring-blue-100"></textarea>
                </div>

                <div class="flex flex-col gap-3 pt-2 md:flex-row md:items-center md:justify-between">
                    <div class="flex flex-col gap-3 sm:flex-row">
                        <button type="submit"
                                class="inline-flex items-center justify-center rounded-full bg-blue-700 px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                            Enregistrer
                        </button>

                        <a th:href="@{/parent/enfants}"
                           class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-6 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                            Annuler
                        </a>
                    </div>
                </div>
            </form>

            <div class="mt-6 border-t border-slate-200 pt-6">
                <form th:action="@{/parent/enfants/{id}/supprimer(id=${childForm.id})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-full bg-red-600 px-6 py-3 text-sm font-bold text-white transition hover:bg-red-700"
                            onclick="return confirm('Supprimer cet enfant et toutes ses inscriptions ?')">
                        Supprimer
                    </button>
                </form>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
