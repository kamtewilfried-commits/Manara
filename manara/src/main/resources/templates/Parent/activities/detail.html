<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Détail activité</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="bg-slate-950">

<div th:replace="~{fragments/headerParent :: headerParent}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarParent :: sidebarParent('activites')}"></div>

    <main  class="container page">

        <!-- Header -->
        <!-- Header -->
        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900"
                    th:text="${activity.name}">
                    Nom activité
                </h1>

                <p class="mt-1 text-sm font-medium text-slate-500"
                   th:text="${activity.categorie}">
                    Catégorie
                </p>
            </div>

            <a th:href="@{/parent/activites}"
               class="inline-flex items-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 shadow-sm hover:bg-slate-50 transition">
                ← Retour
            </a>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div th:if="${erreur}"
             class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
             th:text="${erreur}"></div>

        <!-- Description -->
        <div class="mb-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-3 text-lg font-extrabold text-slate-900">
                À propos de cette activité
            </h2>

            <p class="mb-4 text-sm text-slate-500"
               th:text="${activity.description}">
                Description
            </p>

            <div class="flex flex-wrap gap-6 text-sm text-slate-600">
        <span>
            <strong>Catégorie :</strong>
            <span th:text="${activity.categorie}"></span>
        </span>

                <span th:if="${activity.animateur != null}">
            <strong>Animateur :</strong>
            <span th:text="${activity.animateur.firstName} + ' ' + ${activity.animateur.lastName}"></span>
        </span>
            </div>
        </div>

        <!-- Sessions -->
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-5 text-lg font-extrabold text-slate-900">
                Sessions disponibles
            </h2>

            <!-- Aucune session -->
            <div th:if="${#lists.isEmpty(activity.sessions)}"
                 class="text-center text-sm text-slate-400 py-6">
                Aucune session planifiée pour le moment.
            </div>

            <!-- Session -->
            <div th:each="s : ${activity.sessions}"
                 class="mb-4 rounded-2xl border border-slate-200 p-5">

                <!-- Header session -->
                <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                    <div>
                        <div class="text-sm font-bold text-slate-900"
                             th:text="${#temporals.format(s.startDate, 'EEEE d MMMM yyyy')}">
                            Date
                        </div>

                        <div class="text-xs text-slate-500"
                             th:text="${#temporals.format(s.startDate, 'HH:mm')}
                              + ' – '
                              + ${#temporals.format(s.endDate, 'HH:mm')}
                              + ' · '
                              + ${s.location}">
                            Heure · Lieu
                        </div>
                    </div>

                    <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                          th:classappend="${s.availableSpots > 5} ? ' bg-emerald-50 text-emerald-700' :
                                  (${s.availableSpots > 0} ? ' bg-amber-50 text-amber-700' :
                                  ' bg-red-50 text-red-700')"
                          th:text="${s.availableSpots > 0}
                           ? (${s.availableSpots} + ' places restantes')
                           : 'Complet'">
            </span>
                </div>

                <!-- Form -->
                <form th:action="@{/parent/inscriptions/nouveau}"
                      method="post"
                      th:if="${s.status != 'CANCELLED' and s.status != 'COMPLETED'}"
                      class="flex flex-col gap-3 md:flex-row md:items-center">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="sessionId" th:value="${s.id}">

                    <select name="childId"
                            required
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm md:w-64">
                        <option value="">Choisir un enfant</option>
                        <option th:each="child : ${children}"
                                th:value="${child.id}"
                                th:text="${child.firstName} + ' ' + ${child.lastName}">
                        </option>
                    </select>

                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-full px-5 py-3 text-sm font-bold transition"
                            th:classappend="${s.capacity > 0}
                        ? ' bg-blue-700 text-white hover:bg-blue-800'
                        : ' border border-slate-200 bg-white text-slate-700 hover:bg-slate-50'"
                            th:text="${s.capacity > 0} ? 'Inscrire' : |Liste d'attente|">
                    </button>
                </form>

                <!-- Aucun enfant -->
                <p th:if="${#lists.isEmpty(children)}"
                   class="mt-2 text-xs text-slate-400">
                    Vous devez d'abord
                    <a th:href="@{/parent/enfants/ajouter}" class="text-blue-600 hover:underline">
                        ajouter un enfant
                    </a>
                </p>

                <!-- États -->
                <p th:if="${s.status == 'CANCELLED'}"
                   class="mt-2 text-xs font-medium text-red-600">
                    Cette session a été annulée.
                </p>

                <p th:if="${s.status == 'COMPLETED'}"
                   class="mt-2 text-xs text-slate-400">
                    Cette session est terminée.
                </p>

            </div>
        </div>
    </main>
    </div>
</body>
</html>
