<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Activités disponibles</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="bg-slate-950">

<div th:replace="~{fragments/headerParent :: headerParent}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarParent :: sidebarParent('activites')}"></div>

    <main  class="container page">

        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Activités disponibles</h1>
                <p class="mt-1 text-sm font-medium text-slate-500">
                    Inscrivez vos enfants aux activités du centre
                </p>
            </div>

            <!-- Barre de recherche -->
            <input type="text"
                   id="searchInput"
                   placeholder="Rechercher une activité..."
                   onkeyup="filtrer()"
                   class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-700 shadow-sm focus:border-blue-300 focus:ring-4 focus:ring-blue-100 md:w-56">
        </div>

        <!-- Filtres catégorie -->
        <div class="mb-6 flex flex-wrap gap-3">
            <button class="inline-flex items-center rounded-full bg-blue-700 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800"
                    onclick="filtrerCategorie('')">
                Tout
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerCategorie('musique')">
                Musique
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerCategorie('arts')">
                Arts
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerCategorie('sport')">
                Sport
            </button>

            <button class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
                    onclick="filtrerCategorie('scolaire')">
                Scolaire
            </button>
        </div>

        <!-- Grille activités -->
        <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3" id="activitiesGrid">

            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm"
                 th:each="s : ${sessionList}"
                 th:attr="data-name=${s.activity.name}, data-cat=${s.activity.categorie != null ? s.activity.categorie : ''}">

                <div class="mb-4 flex items-center justify-between">
                    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100 text-xl">
                        🎵
                    </div>

                    <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                          th:classappend="${s.capacity > 5} ? ' bg-emerald-50 text-emerald-700' :
                                  (${s.capacity > 0} ? ' bg-amber-50 text-amber-700' : ' bg-red-50 text-red-700')"
                          th:text="${s.capacity > 0} ? (${s.capacity} + ' places') : 'Complet'">
                Places
            </span>
                </div>

                <h2 class="text-lg font-extrabold text-slate-900"
                    th:text="${s.activity.name}">
                    Nom
                </h2>

                <p class="mt-2 text-sm text-slate-500"
                   th:text="${s.activity.description}">
                    Description
                </p>

                <div class="mt-3 text-sm text-slate-400">
            <span th:if="${s.activity.animateur != null}"
                  th:text="'Animateur · ' + s.activity.animateur.firstName + ' ' + s.activity.animateur.lastName">
                Animateur
            </span>
                </div>

                <a th:href="@{/parent/activites/{id}(id=${s.activity.id})}"
                   class="mt-5 inline-flex items-center rounded-full px-4 py-2 text-sm font-bold transition"
                   th:classappend="${s.capacity > 0} ? ' bg-blue-700 text-white hover:bg-blue-800' : ' border border-slate-200 bg-white text-slate-700 hover:bg-slate-50'"
                   th:text="${s.capacity > 0 ? 'Voir et inscrire' : 'Liste d''attente'}">
                </a>
            </div>

        </div>

        <!-- Aucun résultat -->
        <div id="noResult"
             class="hidden rounded-3xl border border-slate-200 bg-white px-6 py-10 text-center text-sm font-medium text-slate-400 shadow-sm">
            Aucune activité ne correspond à votre recherche.
        </div>
    </main>
</div>

<script>
    function filtrer() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        let visible = 0;
        document.querySelectorAll('.activity-card').forEach(card => {
            const match = card.dataset.name.toLowerCase().includes(val)
                || (card.dataset.cat || '').toLowerCase().includes(val);
            card.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        document.getElementById('noResult').style.display = visible === 0 ? 'block' : 'none';
    }

    function filtrerCategorie(cat) {
        document.getElementById('searchInput').value = cat;
        filtrer();
    }
</script>
</body>
</html>
