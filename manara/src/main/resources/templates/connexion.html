<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connexion</title>
    <link rel="stylesheet" th:href="@{/css/connexion.css}" />
</head>

<body class="login">

<main class="login__wrapper">
    <section class="card login__card">
        <h1 class="login__title">Connexion</h1>

        <form class="form" method="post" th:action="@{/login}">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="username" type="email" required placeholder="exemple@courriel.com" />
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" required placeholder="Votre mot de passe" />
            </div>

            <button class="btn btn--primary btn--full" type="submit">Connexion</button>

            <a class="login__forgot" href="#" th:href="@{/mot-de-passe-oublie}">
                Mot de passe oublié ?
            </a>
        </form>
    </section>
</main>

</body>
</html>
