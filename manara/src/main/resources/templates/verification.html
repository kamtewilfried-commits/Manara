<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vérification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700" >
<div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-2xl p-8 shadow-lg">
    <h2 class="text-2xl font-bold text-white text-center mb-6" >Code de vérification</h2>

<form class="space-y-4" th:action="@{/verification/check}" method="post">
    <input class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition" type="text" name="code" placeholder="Entrez le code" required>
    <button class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition" type="submit">Valider</button>
</form>
</div>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>
</body>
</html>
