<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Créer un compte</title>
    <link rel="stylesheet" th:href="@{/css/creationcompte.css}" />
</head>

<body class="register">

<main class="register__wrapper">
    <section class="card register__card">
        <h1 class="register__title">Créer un compte</h1>

        <form class="form" method="post" th:action="@{/creer-compte}">
            <div class="field-double">
                <div class="field">
                    <label for="nom">Nom</label>
                    <input id="nom" name="nom" type="text" required />
                </div>
                <div class="field">
                    <label for="prenom">Prénom</label>
                    <input id="prenom" name="prenom" type="text" required />
                </div>
            </div>


            <div class="field">
                <label for="date">Date de naissance</label>
                <input id="date" name="date" type="date" required />
            </div>

            <div class="field">
                <label for="email">Adresse e‑mail</label>
                <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
                <label for="phone">Numéro de téléphone</label>
                <input id="phone" name="phone" type="tel" required />
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" required />
            </div>

            <div class="field">
                <label for="confirm">Confirmer le mot de passe</label>
                <input id="confirm" name="confirm" type="password" required />
            </div>

            <button class="btn btn--primary btn--full" type="submit">Créer un compte</button>
        </form>
    </section>
</main>

</body>
</html>
