<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        .product-box {
            background: #f9fafc;
            border: 1px solid #e6ebf1;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .price {
            font-size: 1.5rem;
            color: #635bff;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #5449e6;
        }

        .small-text {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Checkout</h1>

    <div class="product-box">
        <div class="product-name" th:text="${productName}">Don</div>
        <div class="price">$<span th:text="${amount}">10.00</span> CAD</div>
    </div>

    <form th:action="@{/create-checkout-session}" method="post">
        <button type="submit" class="btn">Procéder au paiement</button>
    </form>

    <div class="small-text">
        You’ll be redirected to Stripe’s secure payment page.
    </div>
</div>
</body>
</html>
