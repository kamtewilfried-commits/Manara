<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Feuille de présence</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950" >

<div th:replace="~{fragments/headerAnimateur :: headerAnimateur}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAnimateur :: sidebarAnimateur('presence')}"></div>

    <main class="animateur-content">

        <div class="presence-header">
            <div>
                <div class="page-title">Feuille de présence</div>
                <p class="page-subtitle"
                   th:text="${session.activity.name}
                                + ' — '
                                + ${#temporals.format(session.startDate, 'EEEE d MMMM yyyy')}
                                + ' · '
                                + ${#temporals.format(session.startDate, 'HH:mm')}
                                + ' · '
                                + ${session.location}">
                    Détails session
                </p>
            </div>
            <a th:href="@{/animateur/sessions/{id}(id=${session.id})}"
               class="btn btn-secondary">← Retour</a>
        </div>

        <div th:if="${succes}" class="alert alert-success" th:text="${succes}"></div>

        <!-- Résumé session -->
        <div class="presence-session-info">
                <span th:text="'Inscrits : '
                               + ${#lists.size(registrations)}
                               + ' / '
                               + ${session.capacity}">Inscrits</span>
            <span th:text="'Tranche d\'âge : ' + ${session.activity.ageRange}">Âge</span>
            <span id="compteur" style="font-weight:600; color:var(--color-primary);">
                    0 présent(s)
                </span>
        </div>

        <!-- Formulaire présences -->
        <form th:action="@{/animateur/presence/{id}/enregistrer(id=${session.id})}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="presence-list">

                <!-- En-tête colonnes -->
                <div class="presence-list-header">
                    <span>Enfant</span>
                    <span style="text-align:center;">Allergies</span>
                    <span style="text-align:center;">Présent</span>
                </div>

                <!-- Ligne par enfant inscrit -->
                <div class="presence-row"
                     th:each="reg : ${registrations}"
                     th:classappend="${reg.child.allergies != null
                                          and !reg.child.allergies.isEmpty()} ? 'has-allergie' : ''">

                    <!-- Infos enfant -->
                    <div>
                        <div class="presence-child-name"
                             th:text="${reg.child.firstName} + ' ' + ${reg.child.lastName}">
                            Nom
                        </div>
                        <div class="presence-child-info"
                             th:text="${reg.child.parent.firstName}
                                          + ' '
                                          + ${reg.child.parent.lastName}
                                          + (${reg.child.parent.phone != null}
                                             ? ' · ' + ${reg.child.parent.phone} : '')">
                            Parent
                        </div>
                    </div>

                    <!-- Colonne allergies -->
                    <div class="presence-allergie">
                            <span th:if="${reg.child.allergies != null
                                          and !reg.child.allergies.isEmpty()}"
                                  class="badge badge-warning"
                                  th:text="${reg.child.allergies}">Allergies</span>
                        <span th:if="${reg.child.allergies == null
                                          or reg.child.allergies.isEmpty()}"
                              class="text-muted text-small">—</span>
                    </div>

                    <!-- Case à cocher présence -->
                    <input type="checkbox"
                           class="presence-checkbox"
                           name="presences"
                           th:value="${reg.child.id}"
                           th:checked="${reg.present != null and reg.present}">

                </div>

                <!-- Pied : compteur dynamique -->
                <div class="presence-footer">
                    <span class="text-muted">Cochez les enfants présents</span>
                    <span id="presenceCount" class="presence-count">0 présent(s)</span>
                </div>

            </div>

            <!-- Message si aucun inscrit -->
            <div th:if="${#lists.isEmpty(registrations)}"
                 style="text-align:center; padding:32px; color:var(--color-text-muted); font-size:13px;">
                Aucun enfant inscrit à cette session.
            </div>

            <div style="margin-top:16px; display:flex; gap:10px;"
                 th:if="${!#lists.isEmpty(registrations)}">
                <button type="submit" class="btn btn-primary">
                    Enregistrer les présences
                </button>
                <a th:href="@{/animateur/sessions/{id}(id=${session.id})}"
                   class="btn btn-secondary">Annuler</a>
            </div>

        </form>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function majCompteur() {
        const total = document.querySelectorAll('.presence-checkbox:checked').length;
        document.getElementById('presenceCount').textContent = total + ' présent(s)';
    }
    document.querySelectorAll('.presence-checkbox').forEach(cb => {
        cb.addEventListener('change', majCompteur);
    });
    majCompteur();
</script>
</body>
</html>
