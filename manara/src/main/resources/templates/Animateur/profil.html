<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Mon profil</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950" >

<div th:replace="~{fragments/headerAnimateur :: headerAnimateur}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAnimateur :: sidebarAnimateur('profil')}"></div>

    <main  class="container page">

        <div class="mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Mon profil</h1>
            <p class="mt-1 text-sm font-medium text-slate-500">
                Vos informations personnelles
            </p>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div th:if="${erreur}"
             class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
             th:text="${erreur}"></div>

        <div class="max-w-xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">

            <!-- Header profil -->
            <div class="mb-6 flex items-center gap-4">
                <div class="flex h-16 w-16 items-center justify-center rounded-full bg-indigo-100 text-indigo-700 text-xl font-bold shadow-sm"
                     th:text="${#strings.substring(connectedUser.firstName,0,1)
                       + #strings.substring(connectedUser.lastName,0,1)}">
                    ST
                </div>

                <div>
                    <div class="text-lg font-bold text-slate-900"
                         th:text="${connectedUser.firstName} + ' ' + ${connectedUser.lastName}">
                        Nom
                    </div>
                    <div class="text-sm text-slate-500">Animateur · CRM Manara</div>
                </div>
            </div>

            <!-- FORM INFOS -->
            <form th:action="@{/animateur/profil}" method="post" th:object="${userForm}" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Prénom</label>
                        <input type="text" th:field="*{firstName}" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Nom</label>
                        <input type="text" th:field="*{lastName}" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                    </div>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Adresse courriel</label>
                    <input type="email" th:field="*{email}" required
                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                </div>

                <!-- Activités -->
                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Activités assignées</label>

                    <div class="flex flex-wrap gap-2">
                <span th:each="activity : ${activitesAssignees}"
                      class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700"
                      th:text="${activity.name}">
                    Activité
                </span>

                        <span th:if="${#lists.isEmpty(activitesAssignees)}"
                              class="text-sm text-slate-400">
                    Aucune activité assignée
                </span>
                    </div>

                    <p class="mt-2 text-xs text-slate-400">
                        Les activités sont assignées par l'administrateur.
                    </p>
                </div>

                <button type="submit"
                        class="w-full rounded-full bg-blue-700 px-6 py-3 text-sm font-bold text-white hover:bg-blue-800 transition">
                    Enregistrer les modifications
                </button>
            </form>

            <!-- MOT DE PASSE -->
            <div class="mt-8 border-t border-slate-200 pt-6">
                <h3 class="mb-4 text-sm font-bold text-slate-800">
                    Changer le mot de passe
                </h3>

                <form th:action="@{/animateur/profil/mot-de-passe}"
                      method="post"
                      th:object="${passwordForm}"
                      class="space-y-5">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Mot de passe actuel</label>
                        <input type="password" th:field="*{currentPassword}"
                               placeholder="••••••••"
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                        <div>
                            <label class="mb-2 block text-sm font-bold text-slate-700">Nouveau</label>
                            <input type="password" th:field="*{newPassword}"
                                   placeholder="••••••••"
                                   class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                        </div>

                        <div>
                            <label class="mb-2 block text-sm font-bold text-slate-700">Confirmer</label>
                            <input type="password" th:field="*{confirmPassword}"
                                   placeholder="••••••••"
                                   class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                        </div>
                    </div>

                    <button type="submit"
                            class="rounded-full border border-slate-200 bg-white px-6 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 transition">
                        Changer le mot de passe
                    </button>
                </form>
            </div>

        </div>

    </main>
</div>

</body>
</html>
