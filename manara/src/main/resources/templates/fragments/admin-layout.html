<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Manara Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            min-height: 100vh;
            background: #1f2d3d;
            color: white;
        }
        .sidebar a {
            color: #d1d5db;
            text-decoration: none;
            display: block;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #32475b;
            color: white;
        }
        .brand {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 20px 18px;
            display: block;
            color: white;
            text-decoration: none;
        }
        .content-wrapper {
            padding: 24px;
        }
        .card-stat {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .table-container, .form-container {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body th:fragment="layout(title, content)">
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <a class="brand" th:href="@{/templates/Admin/dashboard}">Manara Admin</a>
            <div class="p-3">
                <a th:href="@{/templates/Admin/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
                <a th:href="@{/templates/Admin/users}" th:classappend="${activeMenu == 'users'} ? 'active'">
                    <i class="bi bi-people me-2"></i> Utilisateurs
                </a>
                <a th:href="@{/templates/Admin/activities}" th:classappend="${activeMenu == 'activities'} ? 'active'">
                    <i class="bi bi-calendar-event me-2"></i> Activités
                </a>
                <a th:href="@{/templates/Admin/calendar}" th:classappend="${activeMenu == 'calendar'} ? 'active'">
                    <i class="bi bi-calendar3 me-2"></i> Calendrier
                </a>
                <a th:href="@{/templates/Admin/statistics}" th:classappend="${activeMenu == 'statistics'} ? 'active'">
                    <i class="bi bi-bar-chart-line me-2"></i> Statistiques
                </a>
                <a th:href="@{/templates/Admin/subscriptions}" th:classappend="${activeMenu == 'subscriptions'} ? 'active'">
                    <i class="bi bi-credit-card me-2"></i> Abonnements
                </a>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-0">
            <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1" th:text="${title}">Tableau de bord</span>
                    <div class="d-flex align-items-center">
                        <span class="me-3">Bonjour, Admin</span>
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
                        </a>
                    </div>
                </div>
            </nav>

            <main class="content-wrapper" th:insert="${content}">
                <!-- contenu -->
            </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
