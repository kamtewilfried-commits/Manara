<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="shortcut icon" th:href="@{/images/Logo.png}" type="image/png">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>

<header class="topbar" th:fragment="headerAdmin" >
    <div class="w-full bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 lg:px-10">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 py-4">
        <!-- Logo -->
                <div class="flex items-center justify-between">
        <a th:href="@{/}" class="flex items-center space-x-3">
            <img th:src="@{/images/Logo.png}"
                 class="h-12 w-12 rounded-full object-cover shadow-sm border border-gray-200" />

            <div>
                <p class="text-lg font-semibold text-gray-800">CRM Manara</p>
                <p class="text-sm text-gray-500">Administration</p>
            </div>
        </a>
<div></div>
        <!-- User -->
        <div class="flex items-center space-x-4">

            <div class="hidden sm:block text-right">
                <p class="text-sm font-semibold text-gray-800"
                   th:text="${connectedUser != null ? connectedUser.firstName + ' ' + connectedUser.lastName : 'Admin'}">
                    Admin
                </p>
                <p class="text-xs text-gray-500">Compte administrateur</p>
            </div>

            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-700 text-sm font-semibold">
                👤
            </div>

            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="px-4 py-2 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-800">
                    Déconnexion
                </button>
            </form>

        </div>
    </div>
    </div>
            </div>
    </div>
</header>

</body>
</html>
