<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sidebar Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<nav th:fragment="sidebarAdmin(activePage)"
     class="flex min-h-screen w-72 flex-col bg-[#03ae87] px-5 py-6 text-white">

    <!-- Brand / Logo -->
    <div class="mb-8 px-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-[#4338CA]">
            <img th:src="@{/images/Logo.png}"
                 class="h-12 w-12 rounded-full object-cover shadow-sm border border-gray-200" />
        </div>
    </div>


    <div class="flex-1 space-y-1">
        <a th:href="@{/dashboard}"
           class="flex items-center gap-4 rounded-xl px-4 py-3 text-[15px] font-semibold transition"
           th:classappend="${activePage == 'dashboard'} ? 'bg-[#3B32B3] text-white' : 'text-white/90 hover:bg-[#4B40D1]'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 9.75V20.25H18.75V9.75" />
            </svg>
            Dashboard
        </a>

        <a th:href="@{/utilisateurs}"
           class="flex items-center gap-4 rounded-xl px-4 py-3 text-[15px] font-semibold transition"
           th:classappend="${activePage == 'team'} ? 'bg-[#3B32B3] text-white' : 'text-white/90 hover:bg-[#4B40D1]'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16"> <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/> </svg>
           Utilisateurs
        </a>

        <a th:href="@{/activites}"
           class="flex items-center gap-4 rounded-xl px-4 py-3 text-[15px] font-semibold transition"
           th:classappend="${activePage == 'projects'} ? 'bg-[#3B32B3] text-white' : 'text-white/90 hover:bg-[#4B40D1]'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-emoji-sunglasses-fill" viewBox="0 0 16 16"> <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM2.31 5.243A1 1 0 0 1 3.28 4H6a1 1 0 0 1 1 1v.116A4.22 4.22 0 0 1 8 5c.35 0 .69.04 1 .116V5a1 1 0 0 1 1-1h2.72a1 1 0 0 1 .97 1.243l-.311 1.242A2 2 0 0 1 11.439 8H11a2 2 0 0 1-1.994-1.839A2.99 2.99 0 0 0 8 6c-.393 0-.74.064-1.006.161A2 2 0 0 1 5 8h-.438a2 2 0 0 1-1.94-1.515L2.31 5.243zM4.969 9.75A3.498 3.498 0 0 0 8 11.5a3.498 3.498 0 0 0 3.032-1.75.5.5 0 1 1 .866.5A4.498 4.498 0 0 1 8 12.5a4.498 4.498 0 0 1-3.898-2.25.5.5 0 0 1 .866-.5z"/> </svg>
            Activités
        </a>

        <a th:href="@{/sessions}"
           class="flex items-center gap-4 rounded-xl px-4 py-3 text-[15px] font-semibold transition"
           th:classappend="${activePage == 'calendar'} ? 'bg-[#3B32B3] text-white' : 'text-white/90 hover:bg-[#4B40D1]'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
            </svg>
          Sessions
        </a>

        <a th:href="@{/inscriptions}"
           class="flex items-center gap-4 rounded-xl px-4 py-3 text-[15px] font-semibold transition"
           th:classappend="${activePage == 'inscriptions'} ? 'bg-[#3B32B3] text-white' : 'text-white/90 hover:bg-[#4B40D1]'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5.25h6M9 9.75h6M9 14.25h6M6.75 5.25h.008v.008H6.75V5.25zm0 4.5h.008v.008H6.75V9.75zm0 4.5h.008v.008H6.75v-.008zM4.5 3h15A1.5 1.5 0 0 1 21 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-15A1.5 1.5 0 0 1 4.5 3z" />
            </svg>
            Inscriptions
        </a>
    </div>


</nav>

</body>
</html>
