<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>

<header th:fragment="headerAnimateur"
        class="sticky top-0 z-50 border-b border-gray-200 bg-white">
    <div class="flex items-center justify-between px-6 py-4">

        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center space-x-3">
            <img th:src="@{/images/Logo.png}"
                 alt="Logo CRM Manara"
                 class="h-12 w-12 rounded-full object-cover border border-gray-200 shadow-sm">

            <div>
                <p class="text-lg font-semibold text-gray-800">CRM Manara</p>
                <p class="text-sm text-gray-500">Animateur</p>
            </div>
        </a>

        <!-- User -->
        <div class="flex items-center space-x-4">
            <div class="hidden sm:block text-right">
                <p class="text-sm font-semibold text-gray-800"
                   th:text="'Bonjour, ' + ${connectedUser.firstName}">
                    Bonjour, Animateur
                </p>
                <p class="text-xs text-gray-500">Espace animateur</p>
            </div>

            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-100 text-indigo-700 text-sm font-bold shadow-sm"
                 th:text="${#strings.substring(connectedUser.firstName, 0, 1) + #strings.substring(connectedUser.lastName, 0, 1)}">
                ST
            </div>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit"
                        class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-gray-800">
                    Déconnexion
                </button>
            </form>
        </div>

    </div>
</header>

</body>
</html>
