<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<section>
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Liste des utilisateurs</h4>
            <a class="btn btn-primary" th:href="@{/templates/Admin/users/new}">
                <i class="bi bi-plus-circle me-1"></i> Ajouter
            </a>
        </div>

        <form class="row g-3 mb-3" method="get" th:action="@{/templates/Admin/users}">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control" placeholder="Rechercher par nom ou email" th:value="${keyword}">
            </div>
            <div class="col-md-3">
                <select name="role" class="form-select">
                    <option value="">Tous les rôles</option>
                    <option value="ADMIN">Admin</option>
                    <option value="MEMBRE">Membre</option>
                    <option value="EMPLOYE">Employé</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark w-100" type="submit">Filtrer</button>
            </div>
        </form>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
               <!-- <td th:text="${user.fullName}">Jean Dupont</td>-->
                <td th:text="${user.email}">jean@mail.com</td>
                <td th:text="${user.role}">ADMIN</td>
                <td>
                    <span class="badge bg-success" th:if="${user.active}">Actif</span>
                    <span class="badge bg-secondary" th:unless="${user.active}">Inactif</span>
                </td>
                <td class="text-center">
                    <a class="btn btn-warning btn-sm" th:href="@{'/admin/users/edit/' + ${user.id}}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a class="btn btn-danger btn-sm"
                       th:href="@{'/admin/users/delete/' + ${user.id}}"
                       onclick="return confirm('Supprimer cet utilisateur ?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
