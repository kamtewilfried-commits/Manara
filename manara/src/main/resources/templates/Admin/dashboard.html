<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Administration</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('dashboard')}"></div>

    <main class="flex-1 p-8 bg-[#f6f7fb]">

        <div class="mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Vue d'ensemble</h1>
            <p class="mt-2 text-sm font-medium text-slate-500"
               th:text="${#temporals.format(#temporals.createNow(), 'EEEE d MMMM yyyy')}">
                Date
            </p>
        </div>

        <div th:if="${succes}"
             class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <!-- Stats -->
        <section class="mb-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-[0_12px_30px_rgba(2,6,23,.08)]">
                <div class="text-3xl font-extrabold text-slate-900" th:text="${totalParents}">0</div>
                <div class="mt-1 text-sm font-medium text-slate-500">Parents inscrits</div>
                <span class="mt-3 inline-flex rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700"
                      th:if="${nouveauxParents > 0}"
                      th:text="'+' + ${nouveauxParents} + ' ce mois'">+0 ce mois</span>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-[0_12px_30px_rgba(2,6,23,.08)]">
                <div class="text-3xl font-extrabold text-slate-900" th:text="${totalActivites}">0</div>
                <div class="mt-1 text-sm font-medium text-slate-500">Activités actives</div>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-[0_12px_30px_rgba(2,6,23,.08)]">
                <div class="text-3xl font-extrabold text-slate-900" th:text="${totalInscriptions}">0</div>
                <div class="mt-1 text-sm font-medium text-slate-500">Inscriptions totales</div>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-[0_12px_30px_rgba(2,6,23,.08)]">
                <div class="text-3xl font-extrabold text-slate-900" th:text="${inscriptionsEnAttente}">0</div>
                <div class="mt-1 text-sm font-medium text-slate-500">En attente de confirmation</div>
            </div>
        </section>

        <!-- Inscriptions récentes -->
        <section class="rounded-3xl border border-slate-200 bg-white shadow-[0_12px_30px_rgba(2,6,23,.08)]">
            <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
                <h2 class="text-lg font-extrabold text-slate-900">Inscriptions récentes</h2>
                <a th:href="@{/inscriptions}"
                   class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                    Voir tout
                </a>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-500">
                    <tr>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Parent</th>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Enfant</th>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Activité</th>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Session</th>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Statut</th>
                        <th class="px-6 py-4 text-left font-extrabold uppercase tracking-wide">Action</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-200 text-slate-700">
                    <tr th:each="reg : ${recentesInscriptions}" class="hover:bg-slate-50/80">
                        <td class="px-6 py-4 font-semibold"
                            th:text="${reg.child.parent.firstName} + ' ' + ${reg.child.parent.lastName}">Parent</td>

                        <td class="px-6 py-4"
                            th:text="${reg.child.firstName}">Enfant</td>

                        <td class="px-6 py-4"
                            th:text="${reg.session.activity.name}">Activité</td>

                        <td class="px-6 py-4"
                            th:text="${#temporals.format(reg.session.startDate, 'd MMM HH:mm')}">Date</td>

                        <td class="px-6 py-4">
                            <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                                  th:classappend="${reg.status == 'CONFIRMED'} ? ' bg-emerald-50 text-emerald-700' :
                                                  (${reg.status == 'PENDING'} ? ' bg-amber-50 text-amber-700' : ' bg-red-50 text-red-700')"
                                  th:text="${reg.status == 'CONFIRMED'} ? 'Confirmée' :
                                           (${reg.status == 'PENDING'} ? 'En attente' : 'Annulée')">
                                Statut
                            </span>
                        </td>

                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <a th:href="@{/inscriptions/voir/{id}(id=${reg.id})}"
                                   class="text-sm font-bold text-blue-700 hover:text-blue-800">
                                    Voir
                                </a>

                                <form th:action="@{/inscriptions/{id}/confirmer(id=${reg.id})}"
                                      method="post"
                                      th:if="${reg.status == 'PENDING'}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit"
                                            class="inline-flex items-center rounded-full bg-blue-600 px-4 py-2 text-xs font-bold text-white transition hover:bg-blue-700">
                                        Confirmer
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(recentesInscriptions)}">
                        <td colspan="6" class="px-6 py-8 text-center text-slate-400">
                            Aucune inscription récente
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</div>

</body>
</html>
