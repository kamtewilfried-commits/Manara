<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Statistiques</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<section>
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card card-stat p-3">
                <h6>Revenu total annuel</h6>
                <h2 th:text="${yearRevenue} + ' $'">20000 $</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat p-3">
                <h6>Nouveaux abonnements</h6>
                <h2 th:text="${newSubscriptions}">55</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat p-3">
                <h6>Total participants</h6>
                <h2 th:text="${participantsCount}">340</h2>
            </div>
        </div>
    </div>

    <div class="table-container">
        <h4 class="mb-3">Résumé mensuel</h4>
        <table class="table table-hover table-bordered">
            <thead class="table-light">
            <tr>
                <th>Mois</th>
                <th>Revenu</th>
                <th>Abonnements</th>
                <th>Participants</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat : ${monthlyStats}">
                <td th:text="${stat.month}">Janvier</td>
                <td th:text="${stat.revenue} + ' $'">1500 $</td>
                <td th:text="${stat.subscriptions}">12</td>
                <td th:text="${stat.participants}">30</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
