<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">activity</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<section>
    <div class="form-container">
        <h4 class="mb-4" th:text="${activity.id == null} ? 'Ajouter une activité' : 'Modifier une activité'">
            Modifier une activité
        </h4>

        <form th:action="@{/templates/Admin/activities/save}" th:object="${activity}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Titre</label>
                <div class="col-md-10">
                    <input type="text" th:field="*{title}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Description</label>
                <div class="col-md-10">
                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Date</label>
                <div class="col-md-10">
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Lieu</label>
                <div class="col-md-10">
                    <input type="text" th:field="*{location}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Capacité</label>
                <div class="col-md-10">
                    <input type="number" th:field="*{capacity}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Statut</label>
                <div class="col-md-10">
                    <select th:field="*{active}" class="form-select">
                        <option th:value="true">Active</option>
                        <option th:value="false">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <label class="col-md-2 col-form-label">Image</label>
                <div class="col-md-10">
                    <input type="file" name="imageFile" class="form-control">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Sauvegarder</button>
                <a th:href="@{/templates/Admin/activities}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</section>
</html>
