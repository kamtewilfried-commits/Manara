<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Activités</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('activites')}"></div>

    <main class="container page">

        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Activités</h1>
                <p class="mt-1 text-sm font-medium text-slate-500">
                    Gérez les activités proposées par le centre
                </p>
            </div>

            <a th:href="@{/activites/nouveau}"
               class="inline-flex items-center justify-center rounded-full bg-blue-700 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                + Nouvelle activité
            </a>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Nom</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Catégorie</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Tranche d'âge</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Animateur</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Sessions</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Statut</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Actions</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-slate-200 text-slate-700">
                <tr th:each="activity : ${activities}" class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-semibold"
                        th:text="${activity.name}">Nom</td>

                    <td class="px-6 py-4"
                        th:text="${activity.categorie != null ? activity.categorie : '—'}">Catégorie</td>

                    <!--    <td class="px-6 py-4"
                       th:text="${activity.ageRange != null ? activity.ageRange : '—'}">Âge</td>-->

                    <td class="px-6 py-4"
                        th:text="${activity.animateur != null ? activity.animateur.firstName + ' ' + activity.animateur.lastName : '—'}">Animateur</td>

                    <td class="px-6 py-4"
                        th:text="${#lists.size(activity.sessions)}">0</td>

                    <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${activity.active} ? ' bg-emerald-50 text-emerald-700' : ' bg-slate-100 text-slate-600'"
                      th:text="${activity.active} ? 'Active' : 'Inactive'">
                    Statut
                </span>
                    </td>

                    <td class="px-6 py-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <a th:href="@{/activites/{id}/modifier(id=${activity.id})}"
                               class="text-sm font-bold text-blue-700 transition hover:text-blue-800">
                                Modifier
                            </a>

                            <a th:href="@{/sessions?activiteId={id}(id=${activity.id})}"
                               class="text-sm font-bold text-slate-700 transition hover:text-slate-900">
                                Sessions
                            </a>

                            <form th:action="@{/activites/{id}/toggle(id=${activity.id})}"
                                  method="post"
                                  class="inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        class="text-sm font-bold transition"
                                        th:classappend="${activity.active} ? ' text-red-600 hover:text-red-700' : ' text-emerald-600 hover:text-emerald-700'"
                                        th:text="${activity.active} ? 'Désactiver' : 'Réactiver'">
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(activities)}">
                    <td colspan="7" class="px-6 py-8 text-center text-slate-400">
                        Aucune activité créée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
