<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Activité</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('activites')}"></div>

    <main class="container page">
        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900"
                    th:text="${activityForm.id != null} ? 'Modifier l\'activité' : 'Nouvelle activité'">
                    Activité
                </h1>
                <p class="mt-1 text-sm font-medium text-slate-500"
                   th:text="${activityForm.id != null}
                    ? 'Modifiez les informations de l\'activité'
                    : 'Créez une nouvelle activité pour le centre'">
                </p>
            </div>

            <a th:href="@{/activites}"
               class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50">
                ← Retour
            </a>
        </div>

        <div th:if="${erreur}"
             class="mb-6 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
             th:text="${erreur}"></div>

        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <form th:action="${activityForm.id != null}
                     ? @{/activites/{id}/modifier(id=${activityForm.id})}
                     : @{/activites/nouveau}"
                  method="post"
                  th:object="${activityForm}"
                  class="space-y-6">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Nom de l'activité</label>
                    <input type="text"
                           th:field="*{name}"
                           placeholder="Ex : Éveil musical"
                           required
                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">
                    <span class="mt-2 block text-sm font-medium text-red-600"
                          th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}"></span>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Animateur responsable</label>
                    <select name="animateurId"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">
                        <option value="">Aucun animateur assigné</option>
                        <option th:each="anim : ${animateurs}"
                                th:value="${anim.id}"
                                th:text="${anim.firstName + ' ' + anim.lastName}">
                        </option>
                    </select>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Description</label>
                    <textarea th:field="*{description}"
                              rows="4"
                              placeholder="Décrivez l'activité..."
                              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100"></textarea>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Statut</label>
                    <select th:field="*{active}"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:justify-between">
                    <a th:href="@{/activites}"
                       class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                        Annuler
                    </a>

                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-full bg-blue-700 px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                        Enregistrer
                    </button>
                </div>

            </form>
        </div>
    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
