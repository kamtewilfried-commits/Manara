<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Inscriptions</title>
    <link rel="shortcut icon" th:href="@{/image/Logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('inscriptions')}"></div>

    <main class="container page">
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Inscriptions</h1>
            <p class="mt-1 text-sm font-medium text-slate-500">
                Suivi et gestion de toutes les inscriptions
            </p>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div class="mb-6 grid gap-4 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-3">
            <input type="text"
                   id="searchInput"
                   onkeyup="filtrer()"
                   placeholder="Rechercher par parent, enfant ou activité..."
                   class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">

            <select id="statutFilter"
                    onchange="filtrer()"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">
                <option value="">Tous les statuts</option>
                <option value="Confirmée">Confirmée</option>
                <option value="En attente">En attente</option>
                <option value="Annulée">Annulée</option>
            </select>

            <select id="attente"
                    onchange="filtrer()"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 outline-none transition focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-100">
                <option value="">Liste d'attente : tous</option>
                <option value="Oui">En liste d'attente</option>
                <option value="Non">Hors liste d'attente</option>
            </select>
        </div>

        <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
            <table class="min-w-full text-sm" id="regTable">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Parent</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Enfant</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Activité</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Session</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Statut</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Liste att.</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Confirmé par</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase tracking-wide">Actions</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-slate-200 text-slate-700">
                <tr th:each="reg : ${registrations}" class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-semibold"
                        th:text="${reg.child.parent.firstName} + ' ' + ${reg.child.parent.lastName}">Parent</td>

                    <td class="px-6 py-4"
                        th:text="${reg.child.firstName} + ' ' + ${reg.child.lastName}">Enfant</td>

                    <td class="px-6 py-4"
                        th:text="${reg.session.activity.name}">Activité</td>

                    <td class="px-6 py-4"
                        th:text="${#temporals.format(reg.session.startDate, 'd MMM HH:mm')}">Date</td>

                    <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${reg.status == 'CONFIRMED'} ? ' bg-emerald-50 text-emerald-700' :
                                      (${reg.status == 'PENDING'} ? ' bg-amber-50 text-amber-700' : ' bg-red-50 text-red-700')"
                      th:text="${reg.status == 'CONFIRMED'} ? 'Confirmée' :
                               (${reg.status == 'PENDING'} ? 'En attente' : 'Annulée')">
                    Statut
                </span>
                    </td>

                    <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${reg.waitlist} ? ' bg-purple-50 text-purple-700' : ' bg-slate-100 text-slate-600'"
                      th:text="${reg.waitlist} ? 'Oui' : 'Non'">
                    Non
                </span>
                    </td>

                    <td class="px-6 py-4"
                        th:text="${reg.confirmedBy != null ?
                         reg.confirmedBy.firstName + ' ' + reg.confirmedBy.lastName
                         : '—'}">Admin</td>

                    <td class="px-6 py-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <a th:href="@{/inscriptions/voir/{id}(id=${reg.id})}"
                               class="text-sm font-bold text-blue-700 transition hover:text-blue-800">
                                Voir
                            </a>

                            <form th:action="@{/inscriptions/{id}/confirmer(id=${reg.id})}"
                                  method="post"
                                  class="inline"
                                  th:if="${reg.status == 'PENDING'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        class="inline-flex items-center rounded-full bg-blue-600 px-4 py-2 text-xs font-bold text-white transition hover:bg-blue-700">
                                    Confirmer
                                </button>
                            </form>

                            <form th:action="@{/inscriptions/{id}/promouvoir(id=${reg.id})}"
                                  method="post"
                                  class="inline"
                                  th:if="${reg.waitlist and reg.status != 'CANCELLED'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        class="inline-flex items-center rounded-full bg-violet-600 px-4 py-2 text-xs font-bold text-white transition hover:bg-violet-700">
                                    Promouvoir
                                </button>
                            </form>

                            <form th:action="@{/inscriptions/{id}/annuler(id=${reg.id})}"
                                  method="post"
                                  class="inline"
                                  th:if="${reg.status != 'CANCELLED'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        class="text-sm font-bold text-red-600 transition hover:text-red-700"
                                        onclick="return confirm('Annuler cette inscription ?')">
                                    Annuler
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(registrations)}">
                    <td colspan="8" class="px-6 py-8 text-center text-slate-400">
                        Aucune inscription
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filtrer() {
        const search  = document.getElementById('searchInput').value.toLowerCase();
        const statut  = document.getElementById('statutFilter').value.toLowerCase();
        const attente = document.getElementById('attente').value.toLowerCase();
        document.querySelectorAll('#regTable tbody tr').forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(search)
            && text.includes(statut)
            && text.includes(attente) ? '' : 'none';
        });
    }
</script>
</body>
</html>
