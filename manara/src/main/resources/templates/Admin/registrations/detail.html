<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Détail inscription</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('inscriptions')}"></div>

    <main class="container page">

        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900"
                    th:text="'Inscription #INS-' + ${registration.id}">
                    Inscription
                </h1>
            </div>

            <div class="flex flex-wrap gap-3">

                <form th:action="@{/inscriptions/{id}/confirmer(id=${registration.id})}"
                      method="post"
                      th:if="${registration.status == 'PENDING'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="rounded-full bg-blue-600 px-5 py-2 text-sm font-bold text-white transition hover:bg-blue-700">
                        Confirmer
                    </button>
                </form>

                <form th:action="@{/inscriptions/{id}/annuler(id=${registration.id})}"
                      method="post"
                      th:if="${registration.status != 'CANCELLED'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="rounded-full bg-red-600 px-5 py-2 text-sm font-bold text-white transition hover:bg-red-700"
                            onclick="return confirm('Annuler cette inscription ?')">
                        Annuler
                    </button>
                </form>

                <a th:href="@{/inscriptions}"
                   class="rounded-full border border-slate-200 bg-white px-5 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
                    ← Retour
                </a>
            </div>
        </div>

        <div th:if="${succes}"
             class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div class="grid gap-6 md:grid-cols-2">

            <!-- Parent & enfant -->
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="mb-4 text-lg font-extrabold text-slate-900">
                    Parent & enfant
                </h2>

                <div class="space-y-3 text-sm text-slate-700">

                    <div class="flex justify-between">
                        <span class="text-slate-500">Parent</span>
                        <span class="font-semibold"
                              th:text="${registration.child.parent.firstName} + ' ' + ${registration.child.parent.lastName}">
                </span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Courriel</span>
                        <span th:text="${registration.child.parent.email}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Téléphone</span>
                        <span th:text="${registration.child.parent.phone != null ? registration.child.parent.phone : '—'}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Enfant</span>
                        <span th:text="${registration.child.firstName} + ' ' + ${registration.child.lastName}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Naissance</span>
                        <span th:text="${#temporals.format(registration.child.birthDate, 'd MMM yyyy')}"></span>
                    </div>

                </div>
            </div>

            <!-- Session & statut -->
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="mb-4 text-lg font-extrabold text-slate-900">
                    Session & statut
                </h2>

                <div class="space-y-3 text-sm text-slate-700">

                    <div class="flex justify-between">
                        <span class="text-slate-500">Activité</span>
                        <span th:text="${registration.session.activity.name}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Date</span>
                        <span th:text="${#temporals.format(registration.session.startDate, 'EEEE d MMMM yyyy')}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Horaire</span>
                        <span th:text="${#temporals.format(registration.session.startDate, 'HH:mm')} + ' – ' + ${#temporals.format(registration.session.endDate, 'HH:mm')}"></span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Lieu</span>
                        <span th:text="${registration.session.location}"></span>
                    </div>

                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">Statut</span>
                        <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                              th:classappend="${registration.status == 'CONFIRMED'} ? ' bg-emerald-50 text-emerald-700' :
                                      (${registration.status == 'PENDING'} ? ' bg-amber-50 text-amber-700' : ' bg-red-50 text-red-700')"
                              th:text="${registration.status == 'CONFIRMED'} ? 'Confirmée' :
                               (${registration.status == 'PENDING'} ? 'En attente' : 'Annulée')">
                </span>
                    </div>

                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">Liste d'attente</span>
                        <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                              th:classappend="${registration.waitlist} ? ' bg-purple-50 text-purple-700' : ' bg-slate-100 text-slate-600'"
                              th:text="${registration.waitlist} ? 'Oui' : 'Non'">
                </span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-slate-500">Confirmé par</span>
                        <span th:text="${registration.confirmedBy != null ?
                               registration.confirmedBy.firstName + ' ' + registration.confirmedBy.lastName
                               : '—'}"></span>
                    </div>

                </div>
            </div>

        </div>
    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
