<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Sessions</title>
    <link rel="shortcut icon" th:href="@{/image/Logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('sessions')}"></div>

    <main class="container page">

        <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Sessions</h1>
                <p class="mt-1 text-sm font-medium text-slate-500">
                    Planifiez et gérez les sessions d'activités
                </p>
            </div>

            <a th:href="@{/sessions/nouveau}"
               class="inline-flex items-center justify-center rounded-full bg-blue-700 px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-blue-800">
                + Nouvelle session
            </a>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <!-- Filtres -->
        <div class="mb-6 grid gap-4 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-2">
            <select id="activiteFilter"
                    onchange="filtrer()"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                <option value="">Toutes les activités</option>
                <option th:each="activity : ${activities}"
                        th:value="${activity.name}"
                        th:text="${activity.name}">
                </option>
            </select>

            <select id="statutFilter"
                    onchange="filtrer()"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                <option value="">Tous les statuts</option>
                <option value="Planifiée">Planifiée</option>
                <option value="En cours">En cours</option>
                <option value="Terminée">Terminée</option>
                <option value="Annulée">Annulée</option>
            </select>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
            <table class="min-w-full text-sm" id="sessionsTable">

                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Activité</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Date début</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Date fin</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Lieu</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Capacité</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Places dispo</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Statut</th>
                    <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Actions</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-slate-200 text-slate-700">
                <tr th:each="s : ${sessions}" class="hover:bg-slate-50">

                    <td class="px-6 py-4 font-semibold"
                        th:text="${s.activity.name}">
                    </td>

                    <td class="px-6 py-4"
                        th:text="${#temporals.format(s.startDate, 'd MMM yyyy HH:mm')}">
                    </td>

                    <td class="px-6 py-4"
                        th:text="${#temporals.format(s.endDate, 'd MMM yyyy HH:mm')}">
                    </td>

                    <td class="px-6 py-4"
                        th:text="${s.location != null ? s.location : '—'}">
                    </td>

                    <td class="px-6 py-4"
                        th:text="${s.capacity}">
                    </td>

                    <!-- Places dispo -->
                    <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${s.availableSpots == 0} ? ' bg-red-50 text-red-700' :
                                      (${s.availableSpots <= 3} ? ' bg-amber-50 text-amber-700' :
                                      ' bg-emerald-50 text-emerald-700')"
                      th:text="${s.availableSpots}">
                </span>
                    </td>

                    <!-- Statut -->
                    <td class="px-6 py-4">
                <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                      th:classappend="${s.status == 'PLANNED'} ? ' bg-indigo-50 text-indigo-700' :
                                      (${s.status == 'IN_PROGRESS'} ? ' bg-blue-50 text-blue-700' :
                                      (${s.status == 'COMPLETED'} ? ' bg-emerald-50 text-emerald-700' :
                                      ' bg-red-50 text-red-700'))"
                      th:text="${s.status == 'PLANNED'} ? 'Planifiée' :
                               (${s.status == 'IN_PROGRESS'} ? 'En cours' :
                               (${s.status == 'COMPLETED'} ? 'Terminée' : 'Annulée'))">
                </span>
                    </td>

                    <!-- Actions -->
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-3">

                            <a th:href="@{/sessions/{id}/modifier(id=${s.id})}"
                               class="text-sm font-bold text-blue-700 transition hover:text-blue-800">
                                Modifier
                            </a>

                            <form th:action="@{/sessions/{id}/annuler(id=${s.id})}"
                                  method="post"
                                  th:if="${s.status == 'PLANNED'}"
                                  class="inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        class="text-sm font-bold text-red-600 hover:text-red-700"
                                        onclick="return confirm('Annuler cette session ?')">
                                    Annuler
                                </button>
                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(sessions)}">
                    <td colspan="8" class="px-6 py-8 text-center text-slate-400">
                        Aucune session planifiée
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filtrer() {
        const activite = document.getElementById('activiteFilter').value.toLowerCase();
        const statut   = document.getElementById('statutFilter').value.toLowerCase();
        document.querySelectorAll('#sessionsTable tbody tr').forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(activite) && text.includes(statut) ? '' : 'none';
        });
    }
</script>
</body>
</html>
