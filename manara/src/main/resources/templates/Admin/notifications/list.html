<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Manara — Notifications</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-slate-950">

<div th:replace="~{fragments/headerAdmin :: headerAdmin}"></div>

<div class="flex min-h-screen bg-slate-100">

    <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin('notifications')}"></div>

    <main class="container page">

        <div class="mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Notifications</h1>
            <p class="mt-1 text-sm font-medium text-slate-500">
                Envoyez des messages aux parents et suivez les livraisons
            </p>
        </div>

        <div th:if="${succes}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"
             th:text="${succes}"></div>

        <div th:if="${erreur}"
             class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700"
             th:text="${erreur}"></div>

        <!-- FORMULAIRE -->
        <div class="mb-8 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="mb-6 text-lg font-extrabold text-slate-900">Envoyer un message</h2>

            <form th:action="@{/notifications/envoyer}" method="post" th:object="${notifForm}" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Destinataires</label>
                        <select th:field="*{recipientType}"
                                onchange="afficherChamp(this.value)"
                                class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                            <option value="ALL">Tous les parents</option>
                            <option value="ACTIVITY">Parents d'une activité</option>
                            <option value="ONE">Un parent en particulier</option>
                        </select>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-bold text-slate-700">Type</label>
                        <select th:field="*{type}"
                                class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                            <option value="REMINDER">Rappel</option>
                            <option value="CONFIRMATION">Confirmation</option>
                            <option value="CANCELLATION">Annulation</option>
                            <option value="RECEIPT">Reçu</option>
                        </select>
                    </div>
                </div>

                <!-- Activité -->
                <div id="champActivite" class="hidden">
                    <label class="mb-2 block text-sm font-bold text-slate-700">Activité</label>
                    <select th:field="*{activityId}"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                        <option value="">Choisir une activité</option>
                        <option th:each="activity : ${activities}"
                                th:value="${activity.id}"
                                th:text="${activity.name}">
                        </option>
                    </select>
                </div>

                <!-- Parent -->
                <div id="champParent" class="hidden">
                    <label class="mb-2 block text-sm font-bold text-slate-700">Parent</label>
                    <select th:field="*{parentId}"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                        <option value="">Choisir un parent</option>
                        <option th:each="parent : ${parents}"
                                th:value="${parent.id}"
                                th:text="${parent.firstName + ' ' + parent.lastName + ' — ' + parent.email}">
                        </option>
                    </select>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Sujet</label>
                    <input type="text"
                           th:field="*{subject}"
                           required
                           placeholder="Sujet du message"
                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-bold text-slate-700">Message</label>
                    <textarea th:field="*{message}"
                              rows="4"
                              required
                              placeholder="Contenu du message..."
                              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-300"></textarea>
                </div>

                <button type="submit"
                        class="rounded-full bg-blue-700 px-6 py-3 text-sm font-bold text-white hover:bg-blue-800 transition">
                    Envoyer
                </button>
            </form>
        </div>

        <!-- HISTORIQUE -->
        <div class="rounded-3xl border border-slate-200 bg-white shadow-sm">
            <div class="px-6 py-4 border-b border-slate-200">
                <h2 class="text-lg font-extrabold text-slate-900">Historique des envois</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-500">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Destinataire</th>
                        <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Sujet</th>
                        <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Type</th>
                        <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Envoyé le</th>
                        <th class="px-6 py-4 text-left text-xs font-extrabold uppercase">Email</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-200 text-slate-700">
                    <tr th:each="notif : ${notifications}" class="hover:bg-slate-50">
                        <td class="px-6 py-4 font-semibold"
                            th:text="${notif.user.firstName} + ' ' + ${notif.user.lastName}"></td>

                        <td class="px-6 py-4" th:text="${notif.subject}"></td>

                        <td class="px-6 py-4">
                    <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                          th:classappend="${notif.type == 'CONFIRMATION'} ? ' bg-emerald-50 text-emerald-700' :
                                          (${notif.type == 'REMINDER'} ? ' bg-blue-50 text-blue-700' :
                                          (${notif.type == 'CANCELLATION'} ? ' bg-red-50 text-red-700' : ' bg-purple-50 text-purple-700'))"
                          th:text="${notif.type == 'CONFIRMATION'} ? 'Confirmation' :
                                   (${notif.type == 'REMINDER'} ? 'Rappel' :
                                   (${notif.type == 'CANCELLATION'} ? 'Annulation' : 'Reçu'))">
                    </span>
                        </td>

                        <td class="px-6 py-4"
                            th:text="${#temporals.format(notif.sentAt, 'd MMM yyyy HH:mm')}"></td>

                        <td class="px-6 py-4">
                    <span class="inline-flex rounded-full px-3 py-1 text-xs font-bold"
                          th:classappend="${notif.emailSent} ? ' bg-emerald-50 text-emerald-700' : ' bg-red-50 text-red-700'"
                          th:text="${notif.emailSent} ? 'Envoyé' : 'Échec'">
                    </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(notifications)}">
                        <td colspan="5" class="px-6 py-8 text-center text-slate-400">
                            Aucune notification envoyée
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>
<div th:replace="fragments/chat-widget :: chatWidget"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /* Affiche le champ activité ou parent selon le destinataire choisi */
    function afficherChamp(val) {
        document.getElementById('champActivite').style.display = val === 'ACTIVITY' ? '' : 'none';
        document.getElementById('champParent').style.display   = val === 'ONE'      ? '' : 'none';
    }
</script>
</body>
</html>
