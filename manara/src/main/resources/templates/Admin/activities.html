<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">Activities</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/admin.css}">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<section>
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Liste des activités</h4>
            <a class="btn btn-primary" th:href="@{/templates/Admin/activities/new}">
                <i class="bi bi-plus-circle me-1"></i> Ajouter une activité
            </a>
        </div>

        <table class="table table-hover table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Titre</th>
                <th>Date</th>
                <th>Lieu</th>
                <th>Capacité</th>
                <th>Statut</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="activity : ${activities}">
                <td th:text="${activity.id}">1</td>
                <td th:text="${activity.title}">Atelier jeunesse</td>
                <td th:text="${activity.date}">2026-04-10</td>
                <td th:text="${activity.location}">Salle B</td>
                <td th:text="${activity.capacity}">40</td>
                <td>
                    <span class="badge bg-success" th:if="${activity.active}">Active</span>
                    <span class="badge bg-secondary" th:unless="${activity.active}">Inactive</span>
                </td>
                <td class="text-center">
                    <a class="btn btn-warning btn-sm" th:href="@{'/admin/activities/edit/' + ${activity.id}}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a class="btn btn-danger btn-sm"
                       th:href="@{'/admin/activities/delete/' + ${activity.id}}"
                       onclick="return confirm('Supprimer cette activité ?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
