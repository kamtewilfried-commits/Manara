<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Subscriptions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<section>
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Liste des abonnements</h4>
            <a class="btn btn-primary" th:href="@{/templates/Admin/subscriptions/new}">
                <i class="bi bi-plus-circle me-1"></i> Ajouter un abonnement
            </a>
        </div>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prix</th>
                <th>Durée</th>
                <th>Avantages</th>
                <th>Statut</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="subscription : ${subscriptions}">
                <td th:text="${subscription.id}">1</td>
                <td th:text="${subscription.name}">Abonnement Premium</td>
                <td th:text="${subscription.price} + ' $'">50 $</td>
                <td th:text="${subscription.duration} + ' mois'">12 mois</td>
                <td th:text="${subscription.benefits}">Accès complet</td>
                <td>
                    <span class="badge bg-success" th:if="${subscription.active}">Actif</span>
                    <span class="badge bg-secondary" th:unless="${subscription.active}">Inactif</span>
                </td>
                <td class="text-center">
                    <a class="btn btn-warning btn-sm" th:href="@{'/admin/subscriptions/edit/' + ${subscription.id}}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a class="btn btn-danger btn-sm"
                       th:href="@{'/admin/subscriptions/delete/' + ${subscription.id}}"
                       onclick="return confirm('Supprimer cet abonnement ?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
