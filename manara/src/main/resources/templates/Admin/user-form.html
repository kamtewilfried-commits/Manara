<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">User-Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<section>
    <div class="form-container">
        <h4 class="mb-4" th:text="${user.id == null} ? 'Ajouter un utilisateur' : 'Modifier un utilisateur'">
            Modifier un utilisateur
        </h4>

        <form th:action="@{/templates/Admin/users/save}" th:object="${user}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">

<!--            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Nom complet</label>
                <div class="col-md-10">
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                </div>
            </div>
-->
            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Email</label>
                <div class="col-md-10">
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Mot de passe</label>
                <div class="col-md-10">
                    <input type="password" name="password" class="form-control" placeholder="Laisser vide pour ne pas modifier">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Rôle</label>
                <div class="col-md-10">
                    <select th:field="*{role}" class="form-select">
                        <option value="ADMIN">Admin</option>
                        <option value="MEMBRE">Membre</option>
                        <option value="EMPLOYE">Employé</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-2 col-form-label">Statut</label>
                <div class="col-md-10">
                    <select th:field="*{active}" class="form-select">
                        <option th:value="true">Actif</option>
                        <option th:value="false">Inactif</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <label class="col-md-2 col-form-label">Photo</label>
                <div class="col-md-10">
                    <input type="file" name="imageFile" class="form-control">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Sauvegarder</button>
                <a th:href="@{/templates/Admin/users}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</section>
</html>
