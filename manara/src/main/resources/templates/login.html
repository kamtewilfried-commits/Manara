<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">

    <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-2xl p-8 shadow-lg" >
        <h2 class="text-2xl font-bold text-white text-center mb-6" >Connexion</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

        <form  class="space-y-4" th:action="@{/login-step1}" method="post">
            <div class="input-group">
            <label  class="block text-sm text-white mb-1" for="email">Email</label>
            <input   class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition" type="email" id="email" name="email" required>
            </div>
<div >
            <label  class="block text-sm text-white mb-1" for="password">Mot de passe</label>
            <input class="w-full px-4 py-3 rounded-lg bg-white/30 text-white placeholder-white/70 focus:bg-white/50 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition" type="password" id="password" name="password" required>
    </div>
            <button type="submit"   class="w-full py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white font-semibold transition">Continuer</button>
        </form>
        <p>
            <br>
            <a th:href="@{/oauth2/authorization/google}" class="btn-google w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-red-500 hover:bg-red-600 text-white font-semibold transition">
                <img th:src="@{/images/google-icon-logo.svg}" class="w-5 h-5">
                Se connecter avec Google
            </a>
        </p>
        <p class="mt-4 text-center text-white text-sm">Pas encore de compte ? <a th:href="@{/register}">Créer un compte</a></p>
    </div>

</body>
</html>
